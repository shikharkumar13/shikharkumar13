      <text x="632.0" y="110" font-size="13.5" fill="#59636e">FastAPI · Docker</text>
    </g>
    <g class="stage" style="animation-delay:0.48s">
      <rect x="816.0" y="30" width="168" height="96" rx="12" fill="#ffffff" stroke="#d0d7de"/>
      <rect x="816.0" y="30" width="168" height="5" rx="2.5" fill="#0d9488"/>
      <text x="832.0" y="60" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#0d9488">05</text>
      <text x="832.0" y="86" font-size="17" font-weight="700" fill="#1f2328">Monitor</text>
      <text x="832.0" y="110" font-size="13.5" fill="#59636e">drift · CI/CD</text>
